<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusView - Sistema de Linhas de Ônibus</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts & Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-color: #0d6efd;
            --sidebar-width: 280px;
        }

        body {
            background-color: #f8f9fa;
            overflow-x: hidden;
        }

        /* Sidebar Styling */
        #sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            z-index: 100;
            background: #212529;
            transition: all 0.3s;
        }

        #content {
            margin-left: var(--sidebar-width);
            padding: 20px;
            transition: all 0.3s;
        }

        .nav-link {
            color: rgba(255,255,255,0.7);
            padding: 12px 20px;
            border-radius: 0;
        }

        .nav-link:hover, .nav-link.active {
            color: #fff;
            background: rgba(255,255,255,0.1);
        }

        .bus-card {
            border: none;
            border-radius: 15px;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .bus-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .status-pill {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
        }

        /* Mobile Adjustments */
        @media (max-width: 992px) {
            #sidebar {
                left: -var(--sidebar-width);
            }
            #sidebar.active {
                left: 0;
            }
            #content {
                margin-left: 0;
            }
            #content.active {
                margin-left: var(--sidebar-width);
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar Menu -->
    <nav id="sidebar" class="d-flex flex-column flex-shrink-0 p-3 text-white">
        <a href="#" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
            <i class="bi bi-bus-front-fill me-2 fs-3"></i>
            <span class="fs-4">BusView</span>
        </a>
        <hr>
        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item">
                <a href="#" class="nav-link active" aria-current="page">
                    <i class="bi bi-house-door me-2"></i> Dashboard
                </a>
            </li>
            <li>
                <a href="#" class="nav-link" onclick="filterLines('urbana')">
                    <i class="bi bi-signpost-split me-2"></i> Linhas Urbanas
                </a>
            </li>
            <li>
                <a href="#" class="nav-link" onclick="filterLines('intermunicipal')">
                    <i class="bi bi-map me-2"></i> Intermunicipais
                </a>
            </li>
            <li>
                <a href="#" class="nav-link">
                    <i class="bi bi-clock-history me-2"></i> Horários Favoritos
                </a>
            </li>
        </ul>
        <hr>
        <div class="dropdown">
            <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" id="dropdownUser1" data-bs-toggle="dropdown" aria-expanded="false">
                <img src="https://ui-avatars.com/api/?name=Usuario&background=random" alt="" width="32" height="32" class="rounded-circle me-2">
                <strong>Configurações</strong>
            </a>
            <ul class="dropdown-menu dropdown-menu-dark text-small shadow" aria-labelledby="dropdownUser1">
                <li><a class="dropdown-item" href="#">Perfil</a></li>
                <li><a class="dropdown-item" href="#">Preferências</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item" href="#">Sair</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main id="content">
        <!-- Header / Search -->
        <div class="container-fluid">
            <div class="row mb-4 align-items-center">
                <div class="col-md-6">
                    <h2 class="fw-bold">Consulta de Linhas</h2>
                    <p class="text-muted">Veja itinerários e horários em tempo real</p>
                </div>
                <div class="col-md-6">
                    <div class="input-group mb-3">
                        <span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span>
                        <input type="text" id="searchInput" class="form-control border-start-0" placeholder="Buscar por número ou nome da linha..." onkeyup="searchBus()">
                    </div>
                </div>
            </div>

            <!-- Stats Banner -->
            <div class="row mb-4">
                <div class="col-md-4 mb-3">
                    <div class="card bg-primary text-white border-0 shadow-sm p-3">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h6 class="mb-0">Linhas Ativas</h6>
                                <h3 class="mb-0 fw-bold">42</h3>
                            </div>
                            <i class="bi bi-check-circle fs-1 opacity-50"></i>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 mb-3">
                    <div class="card bg-success text-white border-0 shadow-sm p-3">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h6 class="mb-0">Em Operação</h6>
                                <h3 class="mb-0 fw-bold">128</h3>
                            </div>
                            <i class="bi bi-activity fs-1 opacity-50"></i>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 mb-3">
                    <div class="card bg-warning text-dark border-0 shadow-sm p-3">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h6 class="mb-0">Alertas/Atrasos</h6>
                                <h3 class="mb-0 fw-bold">3</h3>
                            </div>
                            <i class="bi bi-exclamation-triangle fs-1 opacity-50"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Bus Lines Grid -->
            <div class="row" id="busContainer">
                <!-- Cards will be injected here via JavaScript -->
            </div>
        </div>
    </main>

    <!-- Modal for Details -->
    <div class="modal fade" id="busModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold" id="modalTitle">Detalhes da Linha</h5>
                    <button type="button" class="btn-close" data-bs-toggle="modal" data-bs-target="#busModal"></button>
                </div>
                <div class="modal-body" id="modalBody">
                    <!-- Dynamic content -->
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Mock Data
        const busLines = [
            { id: 101, name: "Centro - Bairro Novo", type: "urbana", status: "Normal", color: "primary", schedule: ["06:00", "06:30", "07:00", "07:30"], route: "Av. Central, Rua das Flores, Praça da Sé" },
            { id: 202, name: "Estação - Shopping", type: "urbana", status: "Atrasada", color: "danger", schedule: ["08:15", "08:45", "09:15"], route: "Terminal Sul, Rodovia Santos, Shopping Park" },
            { id: 305, name: "Circular Universitária", type: "urbana", status: "Normal", color: "primary", schedule: ["07:10", "07:40", "08:10"], route: "Campus I, Campus II, Biblioteca Central" },
            { id: 5001, name: "Cidade Vizinha via BR", type: "intermunicipal", status: "Normal", color: "success", schedule: ["05:00", "09:00", "13:00", "17:00"], route: "Terminal Metropolitano, Rodovia BR-101, Posto Fiscal" },
            { id: 105, name: "Aeroporto - Executivo", type: "urbana", status: "Normal", color: "info", schedule: ["00:00", "01:00", "02:00"], route: "Hotéis Orla, Av. Beira Mar, Aeroporto Int." },
            { id: 404, name: "Vila Verde - Circular", type: "urbana", status: "Manutenção", color: "warning", schedule: ["Indisponível"], route: "Rua do Bosque, Vila Verde, Escola Municipal" }
        ];

        function renderLines(lines) {
            const container = document.getElementById('busContainer');
            container.innerHTML = '';
            
            lines.forEach(line => {
                const col = document.createElement('div');
                col.className = 'col-lg-4 col-md-6 mb-4 bus-item';
                col.innerHTML = `
                    <div class="card bus-card shadow-sm h-100" onclick="showDetails(${line.id})">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <span class="badge bg-${line.color} fs-6">#${line.id}</span>
                                <span class="status-pill bg-${line.status === 'Normal' ? 'success-subtle text-success' : 'danger-subtle text-danger'} fw-bold">
                                    ${line.status}
                                </span>
                            </div>
                            <h5 class="card-title fw-bold">${line.name}</h5>
                            <p class="card-text text-muted small mb-3">
                                <i class="bi bi-geo-alt-fill me-1"></i> ${line.route.substring(0, 40)}...
                            </p>
                            <div class="d-flex align-items-center text-primary fw-bold small">
                                <i class="bi bi-clock me-2"></i> Próximo horário: ${line.schedule[0]}
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(col);
            });
        }

        function showDetails(id) {
            const line = busLines.find(l => l.id === id);
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');
            
            modalTitle.innerText = `Linha ${line.id} - ${line.name}`;
            modalBody.innerHTML = `
                <div class="row">
                    <div class="col-md-6">
                        <h6><strong>Itinerário Completo:</strong></h6>
                        <p>${line.route}</p>
                        <hr>
                        <h6><strong>Status de Operação:</strong></h6>
                        <p class="text-${line.color === 'danger' ? 'danger' : 'success'} fw-bold">${line.status}</p>
                    </div>
                    <div class="col-md-6">
                        <h6><strong>Próximas Partidas:</strong></h6>
                        <ul class="list-group">
                            ${line.schedule.map(time => `<li class="list-group-item d-flex justify-content-between align-items-center">${time} <i class="bi bi-arrow-right-short"></i></li>`).join('')}
                        </ul>
                    </div>
                </div>
                <div class="mt-4">
                     <div class="bg-light p-3 rounded text-center border">
                        <i class="bi bi-map-fill fs-1 text-muted"></i>
                        <p class="mb-0 mt-2">Mapa de GPS em tempo real indisponível nesta demonstração.</p>
                     </div>
                </div>
            `;
            
            const myModal = new bootstrap.Modal(document.getElementById('busModal'));
            myModal.show();
        }

        function searchBus() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = busLines.filter(line => 
                line.name.toLowerCase().includes(query) || 
                line.id.toString().includes(query)
            );
            renderLines(filtered);
        }

        function filterLines(type) {
            const filtered = busLines.filter(line => line.type === type);
            renderLines(filtered);
            
            // Highlight active link
            document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        // Initial Render
        window.onload = () => renderLines(busLines);
    </script>
</body>
</html>
